name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        # web: the push/enrolment tests import py-vapid/http-ece/segno directly.
        # embeddings deliberately absent: the memory tests run on a dependency-free
        # test double; the real model never downloads in CI.
        run: uv sync --extra dev --extra dispatch --extra web
      - name: Run tests
        run: uv run pytest -q
