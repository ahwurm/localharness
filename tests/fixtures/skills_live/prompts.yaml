skills:
  release-notes:
    matching:
      - "Write up what is new in 2.4 for the people who use the app."
      - "Draft the release notes for this version."
      - "Can you put together a release announcement covering everything since the last tag?"
      - "Summarise the changes that shipped after v1.8 so customers know what to expect."
      - "I need a changelog entry for tomorrow's launch, with the fixes first."
      - "List what is new in this version, grouped into features and fixes."
      - "Tell our users what changed since the last release, and flag anything that will break their setup."
      - "We are about to ship; put together what customers should read, with anything incompatible at the top."
      - "Turn the commits from the past few weeks into something a non-developer can read."
      - "Release notes please: features, fixes, and breaking changes for 3.0."
    near_miss:
      - "What is the difference between a release branch and a tag?"
      - "How do semantic version numbers work?"
      - "Is a changelog the same thing as release notes?"
      - "Which git command deletes a tag from the remote?"
      - "How often should a team cut a release?"
      - "What does breaking mean in semantic versioning?"
      - "Should a library announce deprecations a version ahead?"
      - "Who decides when a release is ready to go out?"
      - "Are features usually merged to main before a release?"
      - "Can a tag be moved after it has been pushed?"
