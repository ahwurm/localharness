      - "Do a postmortem for Tuesday's database failure."
      - "Our site was down for two hours. Put together something for leadership: what happened, how bad, why, and what we do next."
      - "Give me an incident summary for the 3am page."
      - "Write the timeline and impact of yesterday's failed deploy."
      - "The queue backed up and customers saw errors for forty minutes. Explain it for the review meeting."
      - "Summarise what broke in the cache layer and the actions we promised."
      - "Draft a short report on the root cause of the login errors."
      - "I need a retrospective on the failover that did not work, with the fixes we agreed on."
      - "Write a follow-up note on the outage for the customers affected."
