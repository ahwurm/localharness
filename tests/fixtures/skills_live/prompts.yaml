creator: "a skill for my weekly status update: from the notes I paste, group the items under Done, Doing and Blocked, keep each item to one short sentence, and end with one line naming the biggest risk. It is for my own machine, not a project."
skills:
  bug-repro-test:
    matching:
      - "Users say checkout crashes with an empty cart. Reproduce the bug with a test before touching the code."
      - "Add a regression test for the off-by-one in the pager."
      - "Could you show, with something I can run, the date parser dropping the last day of the month?"
      - "Something is wrong in the retry logic. Capture the failure in an automated check so it cannot come back."
      - "Can you pin the timeout issue down with a check which fails right now?"
      - "A customer reported the export drops accents. Show me it happens."
      - "Would you write me a runnable check for the unicode crash, so we know the cure works afterwards?"
      - "Can I get something I can run to watch this crash report fail?"
      - "Before we fix this, I want a unit test that shows the null pointer."
      - "Show the memory leak is real with the smallest runnable check you can write."
    near_miss:
      - "Is a regression test the same thing as a unit test?"
      - "Fix the off-by-one bug in the pager."
      - "What makes a test flaky?"
      - "Summarise the bug reports that came in this week."
      - "Can a mathematician prove that every even number is a sum of two primes?"
      - "Delete the failing test that nobody has needed for years."
      - "What does it mean when a build is failing on main?"
      - "Why does regression analysis assume a straight line?"
      - "Run the whole test suite and tell me which files changed."
      - "What does a test pyramid show?"
    unrelated:
      - "What is a polite way to decline a wedding invite?"
      - "How many ounces are in a pound?"
      - "Find me a vegetarian dinner idea using lentils."
      - "Which month has the best weather in Cape Town?"
      - "How do tides work?"
      - "Give me a packing list for a weekend camping trip."
      - "Tell me a fun fact about octopuses."
      - "What time zone is Chicago in?"
      - "How do I keep basil alive on a windowsill?"
      - "Who painted the ceiling of the Sistine Chapel?"
  commit-message:
    matching:
      - "Write a commit message for the changes I have staged."
      - "Can you reword my last commit message? It says 'stuff'."
      - "I just finished the login fix; word the entry that goes in the git history."
      - "What should I put in the history entry for these edits to the parser?"
      - "Could you write up the entry for this refactor, with the module name in front like we always do?"
      - "Help me phrase the log line for this change; the team likes 'area: did thing'."
      - "My history entry got bounced by the hook for having capitals. Can you fix it?"
      - "Summarise the diff I am about to check in as one short sentence."
      - "Name this change for the history so reviewers see what it did."
      - "Compose the message for my commit using our component prefix style."
    near_miss:
      - "What does amending a commit change?"
      - "Why do some teams ban a merge commit?"
      - "Unstage the staged files under docs and keep the rest."
      - "Is a commit the same as a snapshot in git?"
      - "How do I see what is staged without committing?"
      - "Replace every colon in this config file with an equals sign."
      - "Revert the last commit and leave my working tree as it was."
      - "Does git store lowercase and uppercase file names differently?"
      - "Rename the component folder in the web app to match the new design."
      - "What does a prefix tree do?"
    unrelated:
      - "How many cups are in a quart?"
      - "Which river runs through Vienna?"
      - "Give me a stretching routine for stiff shoulders."
      - "What is the square root of 1764?"
      - "Recommend a board game for four players."
      - "How do I get red wine out of a carpet?"
      - "When does the next full moon rise over Denver?"
      - "Translate good morning into Italian."
      - "Which planets are bright in the evening sky?"
      - "What is the tallest mountain in South America?"
  docstring-pass:
    matching:
      - "Add docstrings to everything in utils.py."
      - "Would you write the missing documentation for the helpers in the loader?"
      - "Give every public helper in the parser a short description of what it does, but leave the logic alone."
      - "Can you shorten the explanation at the top of each method? Some of them are long-winded."
      - "Could you put a brief note at the head of every billing class saying what it is for?"
      - "Can each function in config.py open with one tight sentence? Nothing else should change."
      - "Document these functions without touching the code."
      - "Our API reads badly because nobody explained the methods; write the missing explanations as brief notes in the source."
      - "Tighten the docstrings across the package; some run to three paragraphs."
      - "Add one-line docstrings to the test helpers."
    near_miss:
      - "Should docstrings describe the arguments or the behaviour?"
      - "Which language introduced docstrings first?"
      - "What is a Python module?"
      - "Add type hints to the functions in the loader."
      - "Rename the parameters of these functions to match the new style."
      - "Read the file config.py and list its public functions."
      - "Remove the dead code from the billing helpers."
      - "Where do docstrings end up when Sphinx builds documentation?"
      - "Is it rude to ask a colleague to document their code?"
      - "What does a clean architecture diagram look like?"
    unrelated:
      - "How do I fold a fitted sheet?"
      - "Who won the 1998 football World Cup?"
      - "What should I pack for a ski trip?"
      - "Name five birds that can be found in a city park."
      - "How much sugar is in a can of cola?"
      - "How do I sharpen a kitchen knife?"
      - "What is the boiling point of water at altitude?"
      - "Suggest a gift for my sister's birthday."
      - "How many days are there between March 3 and June 12?"
      - "Give me a three step plan to learn guitar chords."
  incident-summary:
    matching:
      - "Write up what went wrong with the payments outage last night."
      - "Do a postmortem for Tuesday's database failure."
      - "Our site was down for two hours. Put together something for leadership: what happened, how bad, why, and what we do next."
      - "Could you document the 3am page for the people who were not on call?"
      - "Can you lay out the sequence of events and the damage from yesterday's failed deploy?"
      - "Customers saw errors for forty minutes when the queue backed up; could you explain it for the review meeting?"
      - "Could you summarise what broke in the cache layer and the actions we promised?"
      - "Draft a short report on the root cause of the login errors."
      - "I need a retrospective on the failover that did not work, with the fixes we agreed on."
      - "Write a note for the affected customers on what happened and what we will do next."
    near_miss:
      - "Who usually attends an incident review?"
      - "What is the difference between an outage and an incident?"
      - "How long should a postmortem meeting last?"
      - "Make the timeline chart on slide four larger."
      - "What does a timeline chart show?"
      - "What is the impact of sleep on memory?"
      - "Is a short nap better than a long one?"
      - "Give me a short summary of this article on sleep."
      - "Schedule the follow ups with each salesperson for next week."
      - "Reset the router after the power outage and check the lights."
    unrelated:
      - "What is the best way to learn to swim as an adult?"
      - "How many calories are in an avocado?"
      - "Recommend a novel set in nineteenth century Russia."
      - "How do I convert a recipe from cups to grams?"
      - "What is the origin of the word 'quarantine'?"
      - "Which airports serve Edinburgh?"
      - "Is it safe to eat rice that was left out overnight?"
      - "Explain how a rainbow forms."
      - "What are some good names for a black cat?"
      - "How do I cut a pineapple?"
  release-notes:
    matching:
      - "Write up what is new in 2.4 for the people who use the app."
      - "Draft the release notes for this version."
      - "Can you put together a release announcement covering everything since the last tag?"
      - "Could you summarise the changes that shipped after v1.8 so customers know what to expect?"
      - "Can you write the changelog entry for tomorrow's launch, with the bugfixes first?"
      - "List what is new in this version, grouped into features and fixes."
      - "Tell our users what changed over the past quarter, and flag anything that will break their setup."
      - "We are about to ship; put together what customers should read, with anything incompatible at the top."
      - "Could you turn the commits of the past few weeks into something a non-developer can read?"
      - "Release notes please: features, fixes, and breaking changes for 3.0."
    near_miss:
      - "What is the difference between a release branch and a tag?"
      - "How do semantic version numbers work?"
      - "Is a changelog the same thing as release notes?"
      - "Delete the tag v0.9 from the remote repository."
      - "How often should a team cut a release?"
      - "What does breaking mean in semantic versioning?"
      - "Bump the version number in package.json to 2.5."
      - "Who decides when a release is ready to go out?"
      - "Merge the features branch into main and resolve the conflicts."
      - "Rebase the release branch onto main and push it."
    unrelated:
      - "What is a good recipe for a quick tomato soup?"
      - "How far is Lisbon from Madrid by train?"
      - "Convert 72 degrees Fahrenheit to Celsius."
      - "Who built the pyramids at Giza, and when?"
      - "What is 15 percent of 240?"
      - "Suggest three podcasts about medieval history."
      - "How long should I boil an egg for a runny yolk?"
      - "Plan a three day trip to Kyoto in spring."
      - "What is the capital of Australia?"
      - "Why does bread dough need to rest?"
  skill-creator:
    matching:
      - "Make a skill that formats my standup notes."
      - "Could we keep what we just did as a repeatable routine for next time?"
      - "Save this as a procedure I can call again."
      - "Can you set up a repeatable way of reviewing pull requests the way I like?"
      - "Improve the skill I wrote for planning meals; it is too vague about portions."
      - "I keep explaining the same routine to you every session. Could you capture it so you stop asking?"
      - "Capture the steps we followed to rotate the keys, so a future session can repeat them."
      - "Package my weekly review routine so it is available in every session."
