      - "Is there a way to lock in the timezone glitch with a check, so the eventual patch can be shown to work?"
      - "Add a regression test for the duplicated rows in the weekly export."
      - "Before the fix lands, prove the cache returns stale prices with a failing test."
      - "Write a red spec for the login redirect loop customers keep hitting, ahead of any change to the code."
      - "What would a small runnable case look like for the PDF export losing page numbers? Write it so it fails now."
