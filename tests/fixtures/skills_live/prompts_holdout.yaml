      - "What is the difference between a bug and a feature request?"
      - "Close every bug ticket that has been open longer than a year."
      - "Mark the failing nightly job as allowed to fail for now."
      - "How do I run only the slow test group locally?"
      - "Translate the reported customer complaints into Spanish."
      - "Delete the regression line from the sales forecast chart."
      - "Prove that the square root of two is irrational."
      - "Who made the decision to drop the old browser support?"
