[project]
name = "localharness"
version = "0.14.1"
description = "Model-agnostic hierarchical agent harness for local LLMs"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "ahwurm" }]
keywords = ["llm", "agents", "local-llm", "agent-harness", "vllm", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-yaml>=1.4,<2",
    "scipy>=1.17,<2",
    "pyyaml>=6.0,<7",
    "bubus>=1.5,<2",
    "pluggy>=1.5,<2",
    "aiosqlite>=0.22,<1",
    "structlog>=25.5,<26",
    "typer>=0.25,<1",
    "rich>=15.0,<16",
    "openai>=1.0,<2",
    "httpx>=0.27",
    "ddgs>=6.0",
    "prompt-toolkit>=3.0,<4",
    "tiktoken>=0.13.0",
    # <2: mcp 2.0.0 renamed streamablehttp_client -> streamable_http_client; unpinned fresh
    # installs crash on `start` (ImportError in tools/mcp.py). Raise only with a compat shim.
    "mcp>=1.27.1,<2",
    "huggingface_hub>=0.26",
    # Directly imported, previously only present because something else happened to pull them in:
    # numpy (bench/aggregator.py, via scipy today), anyio (core/bus.py + memory/history.py, via
    # httpx today) and packaging (cli/update_cmd.py, via the build stack today). A transitive
    # dependency is not a promise — any of those three could drop or re-pin it and break an
    # install that looks fine here.
    "numpy>=1.26,<3",
    "anyio>=4.0,<5",
    "packaging>=23.2",
    # Agent Client Protocol — the one mechanism Zed recognizes an outside agent through
    # (PRD §4). Pure Python, pydantic-only, so it is a main dependency rather than an extra:
    # `localharness acp` must work on a plain `uv tool install localharness`. Upper bound <0.13
    # because the SDK is pre-1.0 and the adapter is pinned to the 0.12 method signatures.
    "agent-client-protocol>=0.12,<0.13",
]

[project.optional-dependencies]
dispatch = [
    "discord.py>=2.3",
]
# Tag-graph discovery's embedding-proximity leg. OPTIONAL: without it, discovery uses the
# dep-free HashingEmbedder fallback. A small local CPU model — no GPU, no network at inference.
embeddings = [
    "sentence-transformers>=2.2,<6",
]
# Exact token counting for Ollama / LM Studio (which serve no /tokenize endpoint): the harness
# loads the served model's OWN GGUF vocab + chat template (vocab-only, no weights, no GPU) and
# counts to the token, offline. OPTIONAL: without it those runtimes fall back to a labeled
# approximate estimate. No prebuilt aarch64 wheel — installs as a source build on ARM64.
exact-tokenizer = [
    "llama-cpp-python>=0.3",
]
# Last-resort repair of malformed JSON from a local model — a truncated tool call
# (provider/fn_call.py) or a garbled proposal (autoresearch/proposer.py). OPTIONAL: both sites
# guard the import and skip the repair step without it, which is what they have always done —
# one of them spelled the package `jsonrepair`, which does not exist on PyPI, so that step could
# never run at all. ONE spelling now: `json-repair`, imported as `json_repair`.
json-repair = [
    "json-repair>=0.30,<1",
]
# The web channel (`localharness web`): the ASGI app and the server behind it. OPTIONAL, on the
# `dispatch` precedent — a terminal-only install should not carry an HTTP server.
#
# DECLARED EXPLICITLY even though `mcp` (a main dependency) already pulls both in today. That is
# the whole lesson of the numpy/anyio/packaging entry above: a transitive dependency is not a
# promise, and `mcp` could drop or re-pin either of these and break an install that looks fine
# here. Starlette rather than FastAPI (no routing sugar is needed, and SSE is written by hand so
# the bus `seq` IS the SSE id); uvicorn rather than a hand-rolled h11 loop; ASGI rather than
# aiohttp so the whole surface is drivable in-process by `httpx.ASGITransport` with no socket and
# no model, which is how every web test runs.
web = [
    "starlette>=0.40,<1",
    "uvicorn>=0.30,<1",
    # Web Push (RFC 8291/8292), for the phone to buzz when a turn finishes or the gate needs a
    # human. These two ARE the crypto core of `pywebpush` — it imports both — and the obvious
    # "just use pywebpush" is measured, not assumed: pywebpush installs 21 packages here against
    # these 6, because it drags in BOTH `requests` and `aiohttp` to ship a transport we do not
    # call. The harness already standardized on httpx (a main dependency, async, and mockable
    # with `httpx.MockTransport` — which is how the push tests run without sending anything), so
    # we take the encoder and keep our own transport. py-vapid also generates the VAPID keypair,
    # so a new user is never sent to an external site to mint push keys (WEBCH-27).
    "py-vapid>=1.9,<2",
    "http-ece>=1.2,<2",
    # The enrolment QR (WEBCH-27): nobody should hand-type a bearer token into a phone keyboard.
    # Pure Python, zero dependencies of its own, and it renders to a terminal directly — no
    # Pillow, no image file. Absent, `localharness web` prints the URL and says so (it degrades,
    # it does not crash).
    "segno>=1.6,<2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
localharness = "localharness.cli.app:main"

[project.urls]
Homepage = "https://localharness.dev"
Documentation = "https://localharness.dev"
Repository = "https://github.com/ahwurm/localharness"
Issues = "https://github.com/ahwurm/localharness/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localharness"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to what a build/install needs — without this, hatchling ships the whole
# repo (bench corpus, docs, assets, tests) in every source tarball.
include = ["src/localharness", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_vllm: opt-in real-model spine test hitting a live vLLM endpoint; skipped by default unless LOCALHARNESS_LIVE_VLLM=1 is set",
    "live_ollama: opt-in real-model round-trip test hitting a live Ollama endpoint; skipped by default unless LOCALHARNESS_LIVE_OLLAMA=1 is set",
    "live_llamacpp: opt-in real-model round-trip test hitting a live llama.cpp endpoint; skipped by default unless LOCALHARNESS_LIVE_LLAMACPP=1 is set",
    "live_llamacpp_lifecycle: opt-in test that the HARNESS SPAWNS llama.cpp itself (SpawnedProcessStrategy) — actually launches llama-server on the GPU; skipped by default unless LOCALHARNESS_LIVE_LLAMACPP_LIFECYCLE=1 is set",
    "live_lmstudio: opt-in real-model round-trip test hitting a live LM Studio endpoint; skipped by default unless LOCALHARNESS_LIVE_LMSTUDIO=1 is set",
]

[tool.ruff.lint]
extend-select = ["S506"]
