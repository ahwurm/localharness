<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>localharness</title>
<!-- The install (A2). `crossorigin="use-credentials"` is load-bearing, not boilerplate: without
     it the browser fetches the manifest anonymously, and the server can only hand a pairing
     `start_url` to a caller that presents the credential. iOS keeps a home-screen app's storage
     in a different jar from Safari's, so this is what stops the installed app starting blank. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<!-- iOS uses THIS for the home-screen icon, not the manifest's, and it does not take an SVG. -->
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!-- theme-color IS the ground (--color-bg). `black-translucent` draws the page UNDER the status
     bar and the Dynamic Island, which is why the header below pays `env(safe-area-inset-top)`:
     translucent without that inset is the clipped-title bug, and an opaque bar with a mismatched
     colour is a grey stripe across the top of an otherwise dark app. Both metas, or neither. -->
<meta name="theme-color" content="#0D0F15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="harness">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!--
  THE REFERENCE PAGE. Its only job is to exercise every wire feature so the contract is
  demonstrable from one file you can read in a sitting. There is no framework and no build step:
  one HTML file, one <style> block, one inline module. Edit it, pull to refresh, done — no server
  restart. It is meant to be copied and cannibalised, not extended.

  It wears the house palette: the hues below are the site's own design tokens, and the terminal
  paints entities with the same ones (localharness/cli/theme.py), so a tool row here and a tool
  row in scrollback are recognisably the same thing. That is ONE block of plain CSS — no design
  system, no theming layer, no build step. Delete it and the page still works, which is the point.

  Style is allowed. UNUSABLE is not: tap targets are real, nothing needs pinch-zoom, nothing
  scrolls sideways, the composer is reachable without scrolling, and the safe-area inset is paid
  at BOTH ends — the Dynamic Island clips the header otherwise, the home indicator the composer.

  The four rules that keep a client correct, all implemented below and all worth stealing:

  1. THE ANSWER IS RENDERED ONCE. It arrives three times — as TokenDelta frames, as an
     `Action(llm_response, has_tool_calls=false)`, and as `TaskComplete.summary`. TaskComplete is
     the one that renders. A tool-less llm_response is NEVER drawn (see renderAction).
  2. ONE RENDERER. The client is a reducer over events. SSE-only frames populate PROVISIONAL
     state; a persisted event always supersedes it. A replayed session simply never enters a
     provisional state, so live and replay share one code path.
  3. EVERYTHING IS TEXT. Every model- or tool-derived string goes in through textContent. A
     rendered-HTML tool result is a prompt-injection foothold that can rewrite the permission
     dialog into whatever the injected page wants it to say.
  4. THE CURSOR IS PERSISTED. Last-seen seq goes to localStorage on EVERY event, because iOS
     reclaims the page and the app relaunches into a fresh JS context where EventSource's own
     resume state is gone. A COLD open still starts CLEAN by design (owner, 2026-09-14: opening
     the app is "just type" — the past lives behind the menu): the persisted cursor's job is the
     in-context resume after backgrounding, and the "earlier activity" pointer on a fresh open —
     not a full replay into the new view. Nothing is silently missed; it is one tap away.
-->
<style>
  /* THE PALETTE. These are localharness.dev's own `@theme` design tokens (src/styles/global.css)
     converted to sRGB, and the terminal paints entities from the same list (cli/theme.py) — the
     token each one came from is named beside it, so nothing here is an invented hex. The short
     names --line/--dim/--bad/--warn/--ok are read by the module below when it colours an
     instrument, so they are interface, not decoration: re-point them, don't rename them. */
  :root {
    --bg:#0D0F15;          /* --color-bg         the ground */
    --surface:#14171E;     /* --color-surface    arguments, output, dialogs, composer */
    --raised:#191D24;      /* --color-surface-2  the reader's own message */
    --line:#272B34;        /* --color-edge       every hairline on the page */
    --ink:#E9EBEF;         /* --color-ink        primary text */
    --dim:#9B9EA6;         /* --color-dim        instruments, meta, narration */
    --agent:#56DC85;       /* --color-accent     agent runtime — the answer */
    --agent-ink:#00220B;   /* --color-accent-ink text ON the accent */
    --tool:#BDA8FC;        /* --color-tool       tool calls */
    --mem:#47D2E8;         /* --color-mem        memory tools */
    --warn:#F0BB3B;        /* --color-amber      the gate needs you */
    --bad:#F7857D;         /* --color-bench      the palette's only red; errors borrow it */
    --ok:var(--agent);
    --col:46rem;           /* the conversation column: header, log and composer share one width */
    --gut:1.25rem;         /* the glyph column every row aligns to */
  }
  * { box-sizing: border-box; }
  html { color-scheme:dark; }
  @media (prefers-reduced-motion:no-preference) { html { scroll-behavior:smooth; } }
  body { margin:0; background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  /* Monospace is for MACHINE text only — arguments, output, instruments. Prose is not code. */
  pre, .meta, #bar, summary, button.small
       { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }

  /* THE RIBBON (owner, 2026-09-14, from the phone screenshot): hamburger left, new-chat right,
     the connection state and the turn instruments between them. Everything that used to crowd
     this bar now lives behind those two ends — history and housekeeping in the drawer, model
     and session config on the composer's settings pill. */
  /* THE INSET IS NOT OPTIONAL (owner, live iPhone): `viewport-fit=cover` plus a translucent
     status bar puts the top of this element under the Dynamic Island unless it pays for it. */
  header { position:sticky; top:0; z-index:5; background:var(--bg);
           background:color-mix(in srgb,var(--bg) 88%,transparent);
           -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
           border-bottom:1px solid var(--line);
           padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
           padding-top:calc(6px + env(safe-area-inset-top)); }
  #bar { display:flex; gap:8px; align-items:center; font-size:12.5px;
         max-width:var(--col); margin:0 auto; }
  #bar b { font-weight:600; }
  #bar .meta { margin:0; }
  .meta:empty { display:none; }        /* an instrument with no reading adds no phantom gap */
  button.icon { flex:none; width:44px; height:44px; min-height:44px; padding:0;
                border-radius:999px; font-size:19px; line-height:1; }
  #mid { flex:1; min-width:0; text-align:center; overflow:hidden; }
  #dials { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #queueBtn { flex:none; color:var(--warn);
              border-color:color-mix(in srgb,var(--warn) 45%,transparent); }
  .offline { color:var(--bad); }

  main { max-width:var(--col); margin:0 auto; padding-top:18px;
         padding-left:max(14px,env(safe-area-inset-left));
         padding-right:max(14px,env(safe-area-inset-right));
         padding-bottom:calc(11rem + env(safe-area-inset-bottom)); }

  /* THE GREETING — the screenshot's empty state: the mark, a serif hello, nothing else.
     It never captures a tap and the first real transcript row retires it (see add()). */
  #greet { position:fixed; inset:0; z-index:0; display:grid; place-content:center;
           justify-items:center; gap:12px; text-align:center; pointer-events:none; }
  #greet[hidden] { display:none; }     /* display:grid would otherwise defeat the attribute */
  #hello { font-family:Georgia,"Times New Roman",serif; font-size:27px; }

  /* ONE ROW SYSTEM: a fixed glyph column carrying the entity's colour, then the content. Same
     hue as the terminal gives that entity, so scrollback and phone agree about what a thing is. */
  .row { display:grid; grid-template-columns:var(--gut) 1fr; margin:14px 0; overflow-wrap:anywhere; }
  .row > * { grid-column:2; min-width:0; }
  /* a grid item stretches by default, and a full-width "copy" bar reads like a primary action */
  .row > button { justify-self:start; align-self:start; margin-top:2px; }
  .row::before { content:"·"; grid-column:1; grid-row:1/-1; color:var(--dim);
                 font-size:13px; line-height:inherit; }
  .sys + .sys { margin-top:4px; }      /* housekeeping lines group instead of marching */

  .answer { font-size:16.5px; line-height:1.62; }
  .answer::before { content:"▌"; color:var(--agent); }
  .prov::before   { content:"▌"; color:var(--agent); animation:blink 1.2s steps(1,end) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion:reduce) { .prov::before { animation:none; } }
  .narr { color:var(--dim); }
  .tool::before { content:"▸"; color:var(--tool); }
  .tool > div:first-of-type { color:var(--tool); font-size:13.5px;
                              font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  /* The group the server reported, not a guess: memory is memory-cyan here exactly as it is in
     `start`'s output, and a delegated subagent call is agent-green. */
  .tool[data-group="memory"]::before,
  .tool[data-group="memory"] > div:first-of-type     { color:var(--mem); }
  .tool[data-group="delegate"]::before,
  .tool[data-group="delegate"] > div:first-of-type   { color:var(--agent); }
  /* A parked permission is an ACTION MOMENT, so it leaves the tool palette for the gate's amber. */
  .gate, .gate::before, .gate > div:first-of-type { color:var(--warn); }
  .sys { color:var(--dim); font-size:13.5px; }
  .err { color:var(--bad); }
  .err::before { content:"✗"; color:var(--bad); }
  .gap { color:var(--bad); border:1px dashed var(--bad); border-radius:12px; padding:10px 12px; }
  .gap::before { content:"✗"; color:var(--bad); }
  .child { margin-left:1.25rem; border-left:1px solid var(--line); padding-left:.75rem; }

  /* The reader's own message is the one raised surface on the page; the agent's answer is plain
     text with a green mark — the terminal's ink-user/green-agent language, carried over. */
  .user { display:block; margin-left:auto; max-width:85%; padding:10px 14px;
          background:var(--raised); border:1px solid var(--line); border-radius:16px; }
  .user::before { content:none; }
  .user .meta { text-align:right; }

  /* max-height (owner, 2026-09-14 "too long vertically"): a wall of output scrolls INSIDE its
     own box instead of paging the whole transcript. */
  pre { margin:8px 0; padding:10px 12px; background:var(--surface); border:1px solid var(--line);
        border-radius:12px; overflow:auto; white-space:pre; font-size:12.5px; line-height:1.5;
        max-height:38vh; }
  .hint { color:var(--dim); font-size:12.5px; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis;
          font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .row.tool, .row.sys, .row.narr { margin:8px 0; }   /* machine rows sit tighter than prose */
  .meta { color:var(--dim); font-size:11.5px; margin-top:5px; letter-spacing:.02em; }
  .untrusted { display:inline-block; margin-left:7px; padding:1px 8px; border-radius:999px;
               font-size:11px; color:var(--warn); border:1px solid var(--warn);
               border-color:color-mix(in srgb,var(--warn) 45%,transparent);
               background:color-mix(in srgb,var(--warn) 12%,transparent); }
  .badge { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px;
           font-size:11px; color:var(--bg); background:var(--warn); }

  button { font:inherit; font-size:14px; min-height:44px; padding:9px 16px; cursor:pointer;
           color:var(--ink); background:var(--raised); border:1px solid var(--line);
           border-radius:12px; }
  button:hover:not(:disabled) { border-color:var(--dim); color:var(--ink); }
  button:disabled { opacity:.35; cursor:default; }
  button.small { min-height:32px; font-size:11.5px; padding:3px 10px; border-radius:999px;
                 color:var(--dim); background:transparent; }
  :focus-visible { outline:2px solid var(--agent); outline-offset:2px; }

  /* The composer floats clear of the home indicator — the same inset bug as the Dynamic Island,
     at the other end of the phone — and the log dissolves into the ground above it. */
  #composer { position:fixed; z-index:6; max-width:var(--col); margin:0 auto;
              left:max(10px,env(safe-area-inset-left)); right:max(10px,env(safe-area-inset-right));
              bottom:calc(10px + env(safe-area-inset-bottom));
              background:var(--surface); border:1px solid var(--line); border-radius:20px;
              padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #composer:focus-within { border-color:color-mix(in srgb,var(--agent) 55%,var(--line)); }
  #composer::before { content:""; position:absolute; left:-1px; right:-1px; bottom:100%;
                      height:40px; pointer-events:none;
                      background:linear-gradient(to top,var(--bg),transparent); }
  #text { display:block; width:100%; font:inherit; font-size:16px; line-height:1.45;
          min-height:46px; max-height:40vh; padding:9px 10px; resize:none;
          color:var(--ink); background:transparent; border:0; outline:none; }
  #text::placeholder { color:var(--dim); }
  #acts { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:4px; }
  #acts button { flex:0 1 auto; font-size:13px; padding:6px 14px; border-radius:999px;
                 background:transparent; color:var(--dim); }
  /* the model/config pill lives IN the prompt box (owner, from the screenshot) */
  #acts #modelBtn { border-color:var(--line); max-width:46vw; overflow:hidden;
                    text-overflow:ellipsis; white-space:nowrap; }
  #acts #send { order:9; margin-left:auto; padding:6px 20px; font-weight:600;
                color:var(--agent-ink); background:var(--agent); border-color:var(--agent); }
  #acts #cancel { order:8; margin-left:auto; }  /* mid-turn, stop takes send's right edge */

  dialog { width:min(94vw,34rem); max-width:min(94vw,34rem); color:var(--ink);
           background:var(--surface); border:1px solid var(--line); border-radius:18px;
           padding:18px; }
  dialog::backdrop { background:rgba(6,8,12,.7); }
  dialog h3 { margin:0 0 10px; font-size:17px; font-weight:600; }
  dialog button { display:block; width:100%; margin-top:8px; text-align:left; }
  dialog pre { max-height:46vh; overflow:auto; }
  #ask { border-color:var(--warn); }     /* the question is the loudest thing on the screen */
  #ask h3 { color:var(--warn); }
  summary { cursor:pointer; min-height:32px; color:var(--dim); font-size:12.5px; padding:4px 0; }
  summary::marker { color:var(--dim); }

  /* THE DRAWER — a left sheet, the hamburger's other half: history first, housekeeping under it. */
  #drawer { position:fixed; inset:0 auto 0 0; margin:0; height:100%; max-height:none;
            width:min(84vw,20rem); border-radius:0 18px 18px 0; overflow-y:auto;
            padding:calc(14px + env(safe-area-inset-top)) 14px
                    calc(14px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left)); }
  #drawer h3:not(:first-child) { margin-top:22px; }
  .sess > div:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #modes { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  #modes button { display:inline-block; width:auto; margin-top:0; }
  #modes .meta { flex-basis:100%; margin:0 0 2px; }
  .modeOn { color:var(--agent); border-color:var(--agent); }
</style>
</head>
<body>
<header>
  <div id="bar">
    <button class="icon" id="menuBtn" aria-label="history and housekeeping">☰</button>
    <div id="mid">
      <b id="state">connecting…</b>
      <div id="dials">
        <span id="phase" class="meta"></span>
        <span id="tok" class="meta"></span>
        <span id="tps" class="meta"></span>
        <span id="ctx" class="meta"></span>
      </div>
    </div>
    <button class="small" id="queueBtn" hidden>needs you <span class="badge" id="pcount">0</span></button>
    <button class="icon" id="newBtn" aria-label="new chat">+</button>
  </div>
</header>

<div id="greet" hidden>
  <img src="/icon.svg" alt="" width="64" height="64">
  <div id="hello">Good day</div>
  <div id="agentline" class="meta"></div>
</div>

<main id="log"></main>
<main id="hist" hidden></main>

<div id="composer">
  <textarea id="text" placeholder="ask…" autocomplete="off" autocapitalize="sentences"></textarea>
  <div id="acts">
    <button class="small" id="modelBtn" title="model and session settings"><span id="model">settings</span></button>
    <button id="retry" hidden title="re-send the last message as a NEW turn; the old answer stays">retry</button>
    <button id="nudge" hidden title="steer the running turn now — no classifier, no model call">nudge</button>
    <button id="queue" hidden title="run after the current turn">queue</button>
    <button id="cancel" hidden>stop</button>
    <button id="send">send</button>
  </div>
</div>

<dialog id="drawer">
  <h3>history</h3>
  <div id="sessions"><div class="meta">open the drawer to read the list…</div></div>
  <h3>housekeeping</h3>
  <button class="small" id="pushBtn" hidden>notifications</button>
  <button class="small" id="recheck" title="re-run the model-server probe">re-check the model server</button>
  <button class="small" id="grantsBtn">grants</button>
  <button class="small" id="protoBtn">protocol</button>
  <button class="small" id="drawerClose">close</button>
</dialog>

<dialog id="cfg">
  <h3>session</h3>
  <div id="cfgModel" class="meta"></div>
  <button class="small" id="reasonBtn">reasoning: off</button>
  <button class="small" id="verboseBtn">verbose: off</button>
  <div id="modes"></div>
  <button class="small" id="cfgClose">close</button>
</dialog>

<dialog id="ask"></dialog>
<dialog id="sheet"></dialog>

<script type="module">
// ---------------------------------------------------------------- credentials
// The token is required on every request, the stream included. It is never put in a URL: a query
// string lands in logs and referrers. POSTs carry it as a bearer header; the stream uses the
// SameSite=Strict cookie that /api/auth/enroll sets in exchange for it.
const LS = window.localStorage;
// PAIRING (A2). The enrolment QR encodes `https://host/#t=<token>`, and the FRAGMENT is the
// reason that is allowed: a fragment is never sent to a server, so it lands in no access log,
// no proxy log and no Referer — which is what the "never put the token in a URL" rule is
// actually about. It is still read once and erased from the address bar immediately, so it
// survives into neither history nor a screenshot. (`?token=` is also accepted, for a link
// someone already bookmarked; it is the worse of the two and the QR never produces it.)
const fragmentToken = new URLSearchParams(location.hash.slice(1)).get("t");
const queryToken = new URLSearchParams(location.search).get("token");
let token = LS.getItem("lh.token") || fragmentToken || queryToken || "";
if (fragmentToken || queryToken) {
  LS.setItem("lh.token", token);
  history.replaceState(null, "", location.pathname + location.search.replace(/[?&]token=[^&]*/, ""));
}
const H = () => ({ "Content-Type": "application/json", "Authorization": "Bearer " + token });
const post = (path, body) =>
  fetch(path, { method: "POST", headers: H(), body: JSON.stringify(body || {}) })
    .then(r => r.json().catch(() => ({ status: r.status })));
const get = (path) => fetch(path, { headers: { "Authorization": "Bearer " + token } }).then(r => r.json());

// ---------------------------------------------------------------- state
const S = {
  session: null, seq: null, turn: false, mode: null, collapsible: ["fs.read", "web", "memory"],
  tools: {}, calls: new Map(), prov: null, lastSent: "", parked: new Map(), asks: new Map(),
  reasoning: false, offline: false, modes: [], verbose: false, burst: null, lastRow: null,
  webNoted: false, bring: null, echoes: [],
};
const $ = id => document.getElementById(id);
const log = $("log");

const cursorKey = () => "lh.seq." + (S.session || "unknown");
function remember(seq) {
  // WEBCH-42. On EVERY event, not on unload: iOS does not reliably run unload handlers, and the
  // case this exists for is precisely the one where the page is reclaimed without warning.
  if (seq == null) return;
  S.seq = seq;
  try { LS.setItem(cursorKey(), String(seq)); } catch (e) { /* private mode: degrade, don't die */ }
}

// ---------------------------------------------------------------- rendering helpers
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // textContent, ALWAYS. Rule 3.
  return n;
}
function atBottom() { return window.innerHeight + window.scrollY >= document.body.offsetHeight - 120; }
function add(node) {
  const stick = atBottom();
  $("greet").hidden = true;   // the first real transcript row retires the greeting
  log.appendChild(node);
  S.lastRow = node;           // burst recency: a row landing after a counter ends its run
  if (stick) window.scrollTo(0, document.body.scrollHeight);
  return node;
}
function copyButton(getText, label) {
  const b = el("button", "small", label || "copy");
  b.onclick = () => {
    // Copy from the STORED string, never from rendered DOM. Re-extracting text from markup is
    // how leading whitespace dies in a code block — the exact defect shipped in a major vendor's
    // Android app.
    const text = getText();
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => { b.textContent = "copied"; setTimeout(() => (b.textContent = label || "copy"), 900); })
      .catch(() => { b.textContent = "copy failed"; });
  };
  return b;
}
function withCode(container, raw, copyable) {
  // Fenced blocks become <pre> with their own copy button; everything else is plain text. Both
  // copy from `raw`, not from the DOM. `copyable=false` drops the whole-message button —
  // narration between tool calls is glanced at, not copied, and the button was a row of height
  // under every explain (owner, 2026-09-14).
  const parts = String(raw).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const body = part.replace(/^[^\n]*\n/, "");      // drop the language tag line
      const pre = el("pre", null, body);
      container.appendChild(pre);
      container.appendChild(copyButton(() => body, "copy code"));
    } else if (part.trim()) {
      container.appendChild(el("div", null, part));
    }
  });
  if (copyable !== false) container.appendChild(copyButton(() => String(raw), "copy message"));
}

// ---------------------------------------------------------------- the reducer
function onEvent(name, data) {
  remember(data.seq);
  const child = !!data.parent_id;
  switch (name) {
    case "UserMessage": {
      // The bus's echo of a message THIS page sent claims the local-echo bubble instead of
      // drawing a second one — the provisional pattern (rule 2), applied to the user's own text.
      const e = S.echoes.length && S.echoes[0].text === data.content ? S.echoes.shift() : null;
      if (e) { e.meta.textContent = "you · via " + data.channel; break; }
      const r = add(el("div", "row user"));
      r.appendChild(el("div", null, data.content));
      r.appendChild(el("div", "meta", "you · via " + data.channel));
      break;
    }
    case "TurnStarted":
      if (!child) { S.turn = true; S.webNoted = false; paint(); }
      add(el("div", "row sys" + (child ? " child" : ""),
        (child ? "subagent turn started — " : "turn started — ") + (data.task_summary || "")));
      break;
    case "TurnCompleted":
      // parent_id means a SUBAGENT's turn ended, not yours. 45% of real sessions delegate, so
      // treating a child's completion as the turn's end clears the running state while the root
      // is still generating.
      if (!child) { S.turn = false; restDials(); paint(); }
      add(el("div", "row sys" + (child ? " child" : ""),
        (child ? "subagent turn done · " : "turn done · ") +
        `${data.iterations} iterations · ${(data.duration_seconds || 0).toFixed(1)}s · ` +
        `${data.input_tokens}+${data.output_tokens} tokens${data.tokens_estimated ? " (estimated)" : ""}`));
      break;
    case "TurnFailed":
      if (!child) { S.turn = false; restDials(); }
      paint();
      add(el("div", "row " + (child ? "sys child" : "err"),
        (child ? "subagent failed — " : "turn failed — ") + data.reason + ": " + (data.detail || "")));
      break;
    case "Action": renderAction(data, child); break;
    case "Observation": renderObservation(data, child); break;
    case "TaskComplete": {
      // THE ANSWER. Rendered from here and nowhere else (rule 1). A CHILD's TaskComplete is
      // forwarded by the wire on purpose and collapsed here: a subagent's summary drawn as a
      // top-level answer reads as a premature, often contradictory final answer.
      const r = add(el("div", "row " + (child ? "sys child" : "answer")));
      if (child) {
        const d = el("details"); d.appendChild(el("summary", null, "subagent finished"));
        d.appendChild(el("div", null, data.summary)); r.appendChild(d);
      } else {
        withCode(r, data.summary || "");
        r.appendChild(el("div", "meta",
          `${data.success ? "ok" : "unsuccessful"} · ${(data.duration_seconds || 0).toFixed(1)}s`));
      }
      break;
    }
    case "Heartbeat":
      if (data.context_utilization_pct != null) {
        $("ctx").textContent = "ctx " + data.context_utilization_pct.toFixed(0) + "%";
        // 80% is where compaction FIRES, so red means "compacting now", not "nearly full".
        $("ctx").style.color = data.context_utilization_pct >= 80 ? "var(--bad)"
          : data.context_utilization_pct >= 65 ? "var(--warn)" : "";
      }
      break;
    case "ParseFailed":
      add(el("div", "row err",
        `tool call not parsed (retry ${data.parse_retry_count}) — the model emitted tool-shaped ` +
        `text nothing read, so nothing ran: ${data.raw_content_preview}`));
      break;
    case "CompactionTriggered":
      add(el("div", "row sys",
        `context compacted ${(data.pre_usage_fraction * 100).toFixed(0)}% → ` +
        `${(data.post_usage_fraction * 100).toFixed(0)}% — older detail summarized`));
      break;
    case "Escalation":
      add(el("div", "row err", "escalated — " + data.reason + ": " + (data.detail || "")));
      break;
    case "InputRouted":
      add(el("div", "row sys", `input routed: ${data.decision} (${data.tier} — ${data.rule_or_reason})`));
      break;
    case "ConsolidationStarted": $("state").dataset.dream = "1"; paint(); break;
    case "ConsolidationFinished": delete $("state").dataset.dream; paint(); break;
    case "PermissionStaged":
      S.parked.set(data.pending.id, data.pending);
      paint();
      add(el("div", "row tool gate",
        `parked #${data.pending.id} — ${data.pending.rendering} (${data.total} waiting; the turn ` +
        `carried on without it)`));
      break;
    case "PermissionResolved":
      // Closes the item on EVERY surface. Answer it in Discord and this badge clears; the bus
      // gives that away free.
      if (data.pending_id != null) S.parked.delete(data.pending_id);
      paint();
      add(el("div", "row sys",
        `permission ${data.decision}${data.pending_id != null ? " (#" + data.pending_id + ")" : ""}` +
        (data.wrote_grant ? " — a permanent grant was written" : "")));
      break;
    case "PermissionAsked": break;   // audit only; it carries no payload to draw
    default: break;
  }
}

// THE BURST COUNTER — the terminal's condensed view, carried over (channels/terminal.py:
// consecutive calls from one family collapse into `read · grep · 5/5`; side-effecting tools
// stay itemized because each one is the audit trail; /verbose is the opt-out). Family
// membership here is the server-declared SAFE group, not a name list — the same opt-in rule
// the argument-collapse uses, so a new dangerous tool cannot start grouping by omission.
// Display-only: per-call truth (args, output, errors) accumulates under the row's <details>.
function burstHead(b) {
  b.label.textContent = (b.child ? "↳ " : "") + b.tools.join(" · ") +
    "  " + b.done + "/" + b.calls + (b.errors ? "  ✗" + b.errors : "");
}
function closeBurst() {
  const b = S.burst;
  if (!b) return;
  S.burst = null;
  // the disclosure the terminal prints when a web burst closes — word for word, and like the
  // terminal, ONCE PER USER TURN, not under every burst
  if (b.group === "web" && !S.webNoted) {
    S.webNoted = true;
    b.row.appendChild(el("div", "meta", "web results — UNTRUSTED, treated as data only"));
  }
}
function burstAdd(group, child, d) {
  const key = group + (child ? "#child" : "");
  if (S.burst && (S.burst.key !== key || S.lastRow !== S.burst.row)) closeBurst();
  if (!S.burst) {
    const row = add(el("div", "row tool" + (child ? " child" : "")));
    row.dataset.group = group;
    const head = el("div");
    const label = el("span");
    head.appendChild(label);
    if (group === "web") head.appendChild(el("span", "untrusted", " untrusted ingest"));
    row.appendChild(head);
    const det = el("details");
    det.appendChild(el("summary", null, "per-call detail"));
    row.appendChild(det);
    S.burst = { key, group, child, row, label, det, tools: [], calls: 0, done: 0, errors: 0 };
  }
  const b = S.burst;
  if (!b.tools.includes(d.tool_name)) b.tools.push(d.tool_name);
  b.calls++;
  const item = el("div", null, d.tool_name);
  item.appendChild(el("pre", null, JSON.stringify(d.tool_params || {}, null, 1)));
  item._burst = b;               // the Observation finds its counter through the item
  b.det.appendChild(item);
  S.calls.set(d.tool_call_id, item);
  burstHead(b);
}

function paramHint(params) {
  // The ONE most telling argument, one line: the command, the path, the query — whichever
  // string comes first. The full arguments stay in the breakout; this is the audit glance.
  for (const v of Object.values(params || {})) {
    if (typeof v === "string" && v.trim()) return v.replace(/\s+/g, " ").slice(0, 90);
  }
  return "";
}

function renderAction(d, child) {
  if (d.action_type === "tool_call") {
    // Be idempotent about a repeated call id. The SERVER is what guarantees no duplicate — the
    // seq de-dup at the reconnect seam, and Last-Event-ID resuming AFTER the id it names — but
    // the cost of being wrong here is silent and permanent: a second row would overwrite the map
    // entry and orphan the first at "waiting…" forever, because the Observation only reaches one.
    if (S.calls.has(d.tool_call_id)) return;
    const group = (S.tools[d.tool_name] || {}).group || "unknown";
    // Opt-in by SAFE group, never opt-out by dangerous group: a tool in a group this client has
    // never heard of is itemized. A newly-added dangerous tool therefore cannot silently start
    // collapsing because nobody remembered to add it to a deny list.
    const collapse = S.collapsible.includes(group);
    // The condensed default (owner, 2026-09-14): safe-group calls consolidate into one counter
    // row; verbose itemizes every call, and a destructive flag itemizes whatever the group says.
    if (!S.verbose && collapse && !(S.tools[d.tool_name] || {}).destructive) {
      burstAdd(group, child, d);
      return;
    }
    const row = add(el("div", "row tool" + (child ? " child" : "")));
    // The GROUP the server reported, handed to the stylesheet so a row can be coloured by what it
    // is — memory cyan, a delegated subagent green — the way the terminal colours the same call.
    row.dataset.group = group;
    const head = el("div", null, (child ? "↳ " : "") + d.tool_name + "  [" + group + "]");
    row.appendChild(head);
    if ((S.tools[d.tool_name] || {}).destructive) head.appendChild(el("span", "untrusted", " destructive"));
    if (["web_search", "web_fetch", "web_page_query"].includes(d.tool_name))
      head.appendChild(el("span", "untrusted", " untrusted ingest"));
    // Vertically condensed (owner, 2026-09-14): the visible row is head + a one-line hint of the
    // telling argument + status. Full arguments and the output land behind one tap; an error
    // opens the fold itself, and verbose starts it open. The command IS still on screen — the
    // hint is the audit line, exactly the terminal's one-line-per-call shape.
    const hint = paramHint(d.tool_params);
    if (hint) row.appendChild(el("div", "hint", hint));
    const det = el("details");
    det.appendChild(el("summary", null, "arguments & output"));
    det.appendChild(el("pre", null, JSON.stringify(d.tool_params || {}, null, 1)));
    det.open = S.verbose;
    row.appendChild(det);
    row._det = det;               // the Observation folds the output into the same breakout
    row._meta = row.appendChild(el("div", "meta", "waiting…"));
    S.calls.set(d.tool_call_id, row);
    return;
  }
  if (d.action_type !== "llm_response") return;
  if (d.has_tool_calls) {
    // Interstitial narration: the model talking while it calls tools. Not copyable — the
    // button was a full row of height under every explain, for text nobody copies.
    if (d.content) { const r = add(el("div", "row narr" + (child ? " child" : ""))); withCode(r, d.content, false); }
  } else {
    // THE FINAL ANSWER — and it must NOT be drawn. TaskComplete renders it. Drawing it here is
    // the single most likely way a client ships with every answer printed twice.
    clearProvisional(d.seq);
  }
}

function renderObservation(d, child) {
  const row = S.calls.get(d.tool_call_id);
  const target = row || add(el("div", "row tool" + (child ? " child" : "")));
  const out = d.output || d.error || "";
  // The body goes into the row's breakout when it has one (itemized rows), or straight into the
  // element when it IS the breakout (a burst's per-call item) or an orphan.
  const home = target._det || target;
  home.appendChild(el("pre", null, out));
  if (d.truncated) home.appendChild(el("div", "meta",
    "truncated from " + (d.original_length ?? "?") + " chars — the full body is not on the bus at all"));
  home.appendChild(copyButton(() => out, "copy output"));
  const bits = [];
  if (d.exit_code != null) bits.push("exit " + d.exit_code);
  if (d.truncated) bits.push("truncated");
  if (d.error) bits.push("error");
  const status = bits.join(" · ") || "done";
  if (target._meta) target._meta.textContent = status;   // the waiting… line becomes the verdict
  else target.appendChild(el("div", "meta", status));
  if (d.error) { target.classList.add("err"); if (target._det) target._det.open = true; }
  const b = target._burst;
  if (b) {
    b.done++;
    if (d.error) { b.errors++; b.det.open = true; }   // an error opens the per-call truth
    burstHead(b);
  }
  S.calls.delete(d.tool_call_id);
}

// ---------------------------------------------------------------- provisional state (rule 2)
function provisional() {
  if (!S.prov) {
    const row = add(el("div", "row prov"));
    const meta = el("div", "meta", "streaming… (this bubble is provisional; the Action that " +
      "lands supersedes it)");
    S.prov = { row, text: "", body: el("div"), reason: el("pre"), meta };
    S.prov.reason.style.display = "none";
    row.appendChild(S.prov.reason);
    row.appendChild(S.prov.body);
    row.appendChild(meta);
  }
  return S.prov;
}
function clearProvisional(bySeq) {
  if (!S.prov) return;
  const p = S.prov;
  S.prov = null;
  // SUPERSEDED. The authoritative event is already on its way in, so the draft must go: leaving
  // it is how the same answer ends up printed twice (rule 1).
  if (bySeq != null) { p.row.remove(); return; }
  // NO SUCCESSOR — a cancelled or failed turn (WEBCH-37). The bubble on screen is then the only
  // copy of that text ANYWHERE: neither path publishes the `llm_response` Action, so nothing is
  // persisted and the replay log has nothing to show later either. Removing it deletes work the
  // user watched being written, which is also the opposite of what the row drawn a moment later
  // promises ("the partial text above stays"). Keep it, and strip the one line on it that has
  // just stopped being true.
  if (!p.text && !p.reason.textContent) { p.row.remove(); return; }   // nothing to keep
  p.meta.remove();
}

// ---------------------------------------------------------------- SSE-only frames
function onFrame(name, d) {
  switch (name) {
    case "Hello":
      S.session = d.session_id; S.mode = d.mode; S.turn = d.turn_in_progress;
      $("state").textContent = d.synthetic ? "REPLAY" : "connected";
      if (d.synthetic) add(el("div", "row sys",
        "REPLAY: the streaming and instrument frames on this connection are SYNTHESIZED from a " +
        "persisted log — plausible, not measured. A blocking ask has no persisted analog at all."));
      if (d.protocol_version !== 1) add(el("div", "row err",
        "protocol_version " + d.protocol_version + " — this page was written against 1. Something " +
        "will render as a blank cell; go read /api/protocol."));
      // A cold open starts clean, so point at the past instead of replaying it (rule 4, amended):
      // a stored cursor for this session means this phone has watched it before.
      if (!d.synthetic && !log.children.length && LS.getItem(cursorKey()) != null)
        add(el("div", "row sys", "earlier activity in this session is in the menu — ☰, top entry."));
      // REPLAY keeps its label: paint() maps a healthy state to the quiet wordmark otherwise.
      paint(d.synthetic ? null : d.model_state);
      break;
    case "TokenDelta": { const p = provisional(); p.text += d.text; p.body.textContent = p.text; break; }
    case "StreamClosed": clearProvisional(d.superseded_by_seq); break;
    case "ReasoningDelta": {
      const p = provisional();
      p.reason.style.display = S.reasoning ? "" : "none";
      p.reason.textContent += d.text;
      break;
    }
    case "StatusTick":
      $("phase").textContent = d.phase + (d.silent > 10 ? " (stalled " + d.silent.toFixed(0) + "s)" : "");
      $("phase").style.color = d.silent > 10 ? "var(--bad)" : "";
      $("tok").textContent = `${d.thinking_tokens}t/${d.answer_tokens}a/${d.tool_call_tokens}c ` +
                             `${d.elapsed.toFixed(0)}s`;
      $("tps").textContent = d.tps == null ? "" :
        d.tps.toFixed(0) + " tok/s" + (d.tps_verified ? "" : "≈") + (d.synthetic ? " (synthetic)" : "");
      $("tps").style.color = d.tps == null ? "" : d.tps >= 30 ? "var(--ok)" : d.tps >= 20 ? "var(--warn)" : "var(--bad)";
      if (d.model) $("model").textContent = d.model;
      if (d.context_pct != null) $("ctx").textContent = "ctx " + d.context_pct.toFixed(0) + "%";
      break;
    case "BlockingAsk": S.asks.set(d.request_id, d); paint(); showAsk(d); break;
    case "AskExpired":
      S.asks.delete(d.request_id); paint();
      if ($("ask").open && $("ask").dataset.rid === d.request_id) $("ask").close();
      add(el("div", "row err",
        `that question expired after ${d.waited_s.toFixed(0)}s and was recorded as ${d.decision}. ` +
        `Nothing ran.`));
      break;
    case "TurnCancelled":
      S.turn = false; clearProvisional(null); restDials(); paint();
      add(el("div", "row sys", "turn cancelled — the partial text above stays."));
      break;
    case "BringUpStage": {
      // ONE self-replacing status row, not a stack (owner, 2026-09-14: opening the app showed
      // build plumbing instead of a chat). Stages update the same line; "ready" removes it;
      // only a FAILURE stays in the transcript, red and readable.
      $("state").textContent = d.failed ? "bring-up failed: " + d.stage : "starting: " + d.stage;
      if (d.failed) {
        if (S.bring) { S.bring.remove(); S.bring = null; }
        add(el("div", "row err", d.stage + (d.detail ? " — " + d.detail : "")));
        break;
      }
      if (d.stage === "ready") {
        if (S.bring) { S.bring.remove(); S.bring = null; }
        $("state").textContent = "harness";
        break;
      }
      if (!S.bring) {
        S.bring = add(el("div", "row sys"));
        S.bring.appendChild(el("div"));
        // A rising number reports elapsed time, not health (WEBCH-43): the build window keeps
        // its OWN way out, because cancelling a TURN is a different state machine.
        if (d.abortable) {
          const b = el("button", "small", "give up on this build");
          b.onclick = async () => {
            const r = await post("/api/bringup/abort");
            add(el("div", "row sys", r.status === "aborting"
              ? "abandoning the build." : "there is no build to abandon."));
          };
          S.bring.appendChild(b);
        }
      }
      S.bring.children[0].textContent =
        "starting the session — " + d.stage + (d.detail ? " · " + d.detail : "");
      break;
    }
    case "Notice": {
      const r = add(el("div", "row " + (d.style === "system.error" ? "err" : "sys")));
      if (d.preformatted) r.appendChild(el("pre", null, d.text)); else r.appendChild(el("div", null, d.text));
      if (d.detail) r.appendChild(el("div", "meta", d.detail));
      break;
    }
    case "GapDetected":
      add(el("div", "row gap",
        `GAP: events ${d.from_seq}–${d.to_seq} were delivered live but are missing from the log. ` +
        d.detail));
      break;
    case "Lagged":
      add(el("div", "row gap", "this client fell behind and its buffer was dropped — resyncing."));
      connect(d.from_seq);
      break;
    default: break;
  }
}

// ---------------------------------------------------------------- the connection
let es = null;
function connect(from) {
  if (es) es.close();
  // In-context resume only (rule 4, amended): S.seq carries across a backgrounding, so the gap
  // backfills and nothing repeats. A COLD open deliberately ignores the stored cursor — the
  // fresh view starts clean and Hello points at the drawer for the past.
  const cursor = from != null ? from : (S.seq != null ? S.seq + 1 : null);
  es = new EventSource("/api/stream" + (cursor != null ? "?from=" + cursor : ""));
  const known = new Set([
    "Hello", "TokenDelta", "StreamClosed", "ReasoningDelta", "StatusTick", "BlockingAsk",
    "AskExpired", "TurnCancelled", "BringUpStage", "Notice", "GapDetected", "Lagged",
  ]);
  es.onopen = () => { S.offline = false; paint(); };
  es.onerror = () => { S.offline = true; paint(); };   // EventSource retries on its own
  const handle = (name) => (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (known.has(name)) onFrame(name, d); else onEvent(name, d);
    if (ev.lastEventId) remember(Number(ev.lastEventId));
  };
  for (const n of known) es.addEventListener(n, handle(n));
  for (const n of ["UserMessage", "TurnStarted", "TurnCompleted", "TurnFailed", "Action",
                   "Observation", "TaskComplete", "Heartbeat", "ParseFailed", "StuckRecovered",
                   "CompactionTriggered", "Escalation", "PermissionAsked", "PermissionStaged",
                   "PermissionResolved", "ConsolidationStarted", "ConsolidationFinished",
                   "InputRouted"]) es.addEventListener(n, handle(n));
}

function restDials() {
  // Between turns the ribbon goes quiet: the phase and token counters are live-turn readings.
  // tok/s and ctx stay — one is the box's honest speed, the other is how full the context is.
  $("phase").textContent = "";
  $("tok").textContent = "";
}

function paint(modelState) {
  closeBurst();   // any state moment — turn boundary, a permission — freezes an open counter
  const s = $("state");
  // The ribbon is QUIET when everything is fine (owner, 2026-09-14: "just type"): a healthy
  // state renders as the wordmark, and the center only speaks when something needs you.
  if (S.offline) { s.textContent = "offline — retrying"; s.className = "offline"; }
  else if (modelState) {
    s.className = "";
    s.textContent = ["ready", "connected", "unknown"].includes(modelState) ? "harness" : modelState;
  } else s.className = "";
  if (modelState === "unreachable") s.textContent = "model server unreachable — start it, then retry";
  else if (modelState === "cold") s.textContent = "cold — send to start the session";
  if (s.dataset.dream) s.textContent += " · dreaming";
  $("pcount").textContent = String(S.parked.size + S.asks.size);
  // the amber pill is an ACTION MOMENT: on the ribbon only while something actually waits
  $("queueBtn").hidden = S.parked.size + S.asks.size === 0;
  // the composer is CONTEXTUAL (owner: "efficient"): between turns you can send, or re-send the
  // last message; during one you can steer it, queue behind it, or stop it. Same verbs as the
  // wire offers at that moment — never a button that can only fail.
  $("send").hidden = S.turn;
  $("nudge").hidden = !S.turn;
  $("queue").hidden = !S.turn;
  $("cancel").hidden = !S.turn;
  $("cancel").disabled = !S.turn;
  $("retry").hidden = S.turn || !S.lastSent;
}

// ---------------------------------------------------------------- permission UI
function showAsk(d) {
  const dlg = $("ask");
  dlg.dataset.rid = d.request_id;
  dlg.replaceChildren();
  dlg.appendChild(el("h3", null, d.klass === "workspace-trust" ? "Trust this workspace?" : "Permission"));
  dlg.appendChild(el("div", null, d.display || d.reason));
  if (d.untrusted_ingest) dlg.appendChild(el("div", "untrusted",
    "this tool ingests attacker-controllable content"));
  dlg.appendChild(el("pre", null, JSON.stringify(d.tool_params, null, 1)));
  if (d.deadline_s) dlg.appendChild(el("div", "meta",
    `the gate stops waiting after about ${d.deadline_s}s and records a denial`));
  for (const o of d.options) {
    const b = el("button", null, o.name + (o.confirm_required ? " (2 taps)" : ""));
    b.onclick = async () => {
      let r = await post(`/api/permissions/${d.request_id}/answer`, { kind: o.kind });
      if (r.status === "confirm_required") {
        // The second tap is enforced by the SERVER, not here. This page is the owner's disposable
        // half — anything else holding the token (curl, a Shortcut, a future UI) hits the same
        // wall, which is the whole point of putting it there rather than in a page.
        if (!confirm(r.detail)) return;
        r = await post(`/api/permissions/${d.request_id}/answer`,
                       { kind: o.kind, confirm_token: r.confirm_token });
      }
      S.asks.delete(d.request_id); paint(); dlg.close();
      add(el("div", "row sys", "answered: " + (r.decision || r.status)));
    };
    dlg.appendChild(b);
  }
  dlg.showModal();
}

async function showQueue() {
  const dlg = $("sheet");
  const state = await get("/api/permissions");
  dlg.replaceChildren(el("h3", null, "needs you"));
  for (const a of state.blocking) {
    const b = el("button", null, "answer: " + (a.display || a.tool_name));
    b.onclick = () => { dlg.close(); showAsk(a); };
    dlg.appendChild(b);
  }
  if (!state.parked.length && !state.blocking.length)
    dlg.appendChild(el("div", null, "nothing waiting."));
  for (const p of state.parked) {
    const row = el("div", "row tool gate");
    row.appendChild(el("div", null, `#${p.id} ${p.rendering}`));
    row.appendChild(el("div", "meta", p.agent_label || "this agent"));
    for (const verb of ["approve", "deny"]) {
      const b = el("button", null, verb);
      b.onclick = async () => {
        const r = await post(`/api/pending/${p.id}/${verb}`);
        add(el("div", "row sys", r.note || r.detail || r.status));
        dlg.close(); paint();
      };
      row.appendChild(b);
    }
    dlg.appendChild(row);
  }
  const close = el("button", null, "close"); close.onclick = () => dlg.close();
  dlg.appendChild(close);
  dlg.showModal();
}

async function showSheet(title, body) {
  const dlg = $("sheet");
  dlg.replaceChildren(el("h3", null, title), el("pre", null, body));
  const close = el("button", null, "close"); close.onclick = () => dlg.close();
  dlg.appendChild(close); dlg.showModal();
}

// ---------------------------------------------------------------- composer
async function send(intent) {
  const text = $("text").value.trim();
  if (!text) return;
  S.lastSent = text;
  $("text").value = "";
  // LOCAL ECHO (owner, 2026-09-14, "I don't even see my message after I send it"): the bubble
  // appears the moment the thumb hits send, and its meta line carries the delivery truth. The
  // bus's own UserMessage echo later claims this row (see the reducer) rather than duplicating.
  const row = add(el("div", "row user"));
  row.appendChild(el("div", null, text));
  const meta = el("div", "meta", "you · sending…");
  row.appendChild(meta);
  S.echoes.push({ text, meta });
  const r = await post(`/api/sessions/${S.session || "current"}/message`,
                       intent ? { text, intent } : { text });
  if (r.status === "no_resolver") { meta.textContent = "you · NOT delivered"; add(el("div", "row err", r.detail)); }
  else if (r.bringing_up) meta.textContent = "you · sent — the session is starting for this message";
  else meta.textContent = "you · sent";
  paint();   // `retry` becomes offerable the moment there is a last message to re-send
}
$("send").onclick = () => send(null);
$("nudge").onclick = () => send("nudge");
$("queue").onclick = () => send("queue");
$("retry").onclick = () => {
  // Re-sends as an ordinary NEW turn on the same linear session. Not a branch: the log is
  // append-only JSONL and a mis-built branch is worse than none. The old answer stays readable.
  if (!S.lastSent) return;
  $("text").value = S.lastSent;
  add(el("div", "row sys", "retrying — the previous answer stays above"));
  send(null);
};

let undo = null;
$("cancel").onclick = () => {
  // A brief undo window before the POST fires. Cancel sits next to the composer where a
  // distracted thumb lands, and on this box the GPU is the scarce resource — a mis-tap discards
  // real generation.
  if (undo) return;
  const row = add(el("div", "row sys"));
  row.appendChild(el("span", null, "cancelling in 3s… "));
  const b = el("button", "small", "undo");
  b.onclick = () => { clearTimeout(undo); undo = null; row.remove(); };
  row.appendChild(b);
  undo = setTimeout(async () => {
    undo = null; row.remove();
    const r = await post(`/api/sessions/${S.session || "current"}/cancel`);
    if (r.status === "nothing_to_cancel") add(el("div", "row sys", "nothing was running."));
  }, 3000);
};

$("reasonBtn").onclick = async () => {
  S.reasoning = !S.reasoning;
  $("reasonBtn").textContent = "reasoning: " + (S.reasoning ? "on" : "off");
  if (S.prov) S.prov.reason.style.display = S.reasoning ? "" : "none";
  // The server-side toggle too, through the REPL's own dispatcher — so the two surfaces cannot
  // drift and `/reasoning` means the same thing wherever it is typed.
  await post(`/api/sessions/${S.session || "current"}/command`,
             { text: "/reasoning " + (S.reasoning ? "on" : "off") });
};
$("queueBtn").onclick = showQueue;
$("grantsBtn").onclick = async () => {
  const g = await get("/api/grants");
  showSheet("permanent grants (" + g.grants.length + ")", g.note + "\n\n" + JSON.stringify(g.grants, null, 1));
};
$("protoBtn").onclick = async () => {
  const p = await get("/api/protocol");
  showSheet("protocol v" + p.protocol_version, JSON.stringify(p, null, 1));
};

// ---------------------------------------------------------------- the drawer (hamburger)
// History straight off the wire: GET /api/sessions lists the logs on disk, a tap renders one
// through the digest below. No client-side session store — the disk is the store.
async function loadSessions() {
  const box = $("sessions");
  box.replaceChildren(el("div", "meta", "reading the log directory…"));
  try {
    const r = await get("/api/sessions");
    box.replaceChildren();
    if (r.note) box.appendChild(el("div", "meta", r.note));
    for (const s of r.sessions || []) {
      const b = el("button", "sess");
      b.appendChild(el("div", null, s.title || s.session_id));
      b.appendChild(el("div", "meta", (s.live ? "live now · " : "") +
        new Date(s.modified_unix * 1000).toLocaleString() +
        " · " + (s.size_bytes / 1024).toFixed(0) + " KB"));
      b.onclick = () => { $("drawer").close(); openHistory(s.session_id, s.live); };
      box.appendChild(b);
    }
    if (!(r.sessions || []).length && !r.note)
      box.appendChild(el("div", "meta", "no session logs on disk yet."));
  } catch (e) { box.replaceChildren(el("div", "meta", "could not read /api/sessions: " + e)); }
}

// THE DIGEST, deliberately: only rule 1's blessed sources are drawn — UserMessage in,
// TaskComplete out, TurnFailed as the miss — so history can never contradict what live
// rendering said. Full fidelity stays a server feature: `localharness web --replay`.
async function openHistory(id, live) {
  const hist = $("hist");
  hist.replaceChildren();
  const bar = el("div", "row sys");
  const back = el("button", "small", "back to live");
  back.onclick = closeHistory;
  bar.appendChild(back);
  bar.appendChild(el("div", "meta",
    (live ? "current session — up to now" : "history · " + id) + " · read-only"));
  hist.appendChild(bar);
  let text = "";
  try {
    const r = await fetch(`/api/sessions/${encodeURIComponent(id)}/events`,
                          { headers: { "Authorization": "Bearer " + token } });
    text = await r.text();
  } catch (e) { hist.appendChild(el("div", "row err", "could not read that session: " + e)); }
  for (const line of text.split("\n")) {
    let d; try { d = JSON.parse(line); } catch (e) { continue; }
    if (d.parent_id) continue;               // a subagent's traffic collapses to nothing here
    if (d.event_type === "UserMessage") {
      const r2 = el("div", "row user");
      r2.appendChild(el("div", null, d.content));
      hist.appendChild(r2);
    } else if (d.event_type === "TaskComplete") {
      const r2 = el("div", "row answer");
      withCode(r2, d.summary || "");
      hist.appendChild(r2);
    } else if (d.event_type === "TurnFailed") {
      hist.appendChild(el("div", "row err",
        "turn failed — " + d.reason + ": " + (d.detail || "")));
    }
  }
  log.hidden = true; $("composer").hidden = true; $("greet").hidden = true;
  hist.hidden = false;
  window.scrollTo(0, 0);
}
function closeHistory() {
  $("hist").hidden = true; $("hist").replaceChildren();
  log.hidden = false; $("composer").hidden = false;
  window.scrollTo(0, document.body.scrollHeight);
}
$("menuBtn").onclick = () => { $("drawer").showModal(); loadSessions(); };
$("drawerClose").onclick = () => $("drawer").close();

// ---------------------------------------------------------------- new chat (the honest button)
$("newBtn").onclick = () => {
  // One process serves one LIVE session and no wire verb restarts it yet, so this button cannot
  // fake a throwaway thread. Cold box: the composer already IS the new chat — go there. Live
  // session: say the true thing instead of pretending.
  if (S.session == null && !S.turn) { closeHistory(); $("text").focus(); return; }
  showSheet("new chat", "this agent runs ONE continuous session — its memory carries across " +
    "turns, so there is no throwaway thread to open.\n\na fresh-session verb is not on the " +
    "wire yet; when it lands, this button starts using it.");
};

// ---------------------------------------------------------------- the settings pill
// The model/config home the owner asked for: IN the prompt box. The pill's label is the model
// name the instruments report; tapping it opens the session sheet — reasoning, permission mode
// (the one wire verb this page never exercised before), and the current readings.
function paintModes() {
  const box = $("modes");
  box.replaceChildren();
  if (S.modes.length) box.appendChild(el("div", "meta", "permission mode, via POST …/mode"));
  for (const m of S.modes) {
    const b = el("button", "small" + (m === S.mode ? " modeOn" : ""), m);
    b.onclick = async () => {
      const r = await post(`/api/sessions/${S.session || "current"}/mode`, { mode: m });
      if (r.mode) { S.mode = r.mode; paintModes(); add(el("div", "row sys", "permission mode set: " + r.mode)); }
      else add(el("div", "row err", "mode not set — " + (r.error || JSON.stringify(r))));
    };
    box.appendChild(b);
  }
}
$("modelBtn").onclick = () => {
  $("cfgModel").textContent = [$("model").textContent, $("ctx").textContent, $("tps").textContent]
    .filter(t => t && t !== "settings").join(" · ")
    || "no model reading yet — the instruments arrive with the first turn";
  paintModes();
  $("cfg").showModal();
};
$("verboseBtn").onclick = () => {
  // Client-side only, unlike the reasoning toggle: reasoning DELTAS are gated server-side, but
  // every event already reaches this page — density is this client's half. Posting /verbose
  // would flip the terminal's scrollback from a phone, which is nobody's expectation.
  S.verbose = !S.verbose;
  $("verboseBtn").textContent = "verbose: " + (S.verbose ? "on" : "off");
  closeBurst();   // applies from the next call on; rows already drawn stay as drawn
};
$("cfgClose").onclick = () => $("cfg").close();
// a tap on the dim backdrop closes a sheet, exactly as a thumb expects
for (const dlgId of ["drawer", "cfg"]) {
  $(dlgId).onclick = (ev) => { if (ev.target === $(dlgId)) $(dlgId).close(); };
}

// ---------------------------------------------------------------- the app shell (A2)
// Installed = running from the home screen. iOS reports it on `navigator.standalone`, everyone
// else through the display-mode media query.
const installed = () =>
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
  window.navigator.standalone === true;

// HTTPS gating, said out loud instead of failing silently. A service worker — and therefore
// install and push — needs a secure context: https, or localhost. Over plain http on a LAN
// address the browser refuses, so the page degrades to a browser tab and SAYS SO rather than
// showing a button that throws. `tailscale serve` is the supported way to get the certificate.
const secure = window.isSecureContext === true;
let swReg = null;

async function registerWorker() {
  if (!secure || !("serviceWorker" in navigator)) return null;
  try {
    swReg = await navigator.serviceWorker.register("/sw.js");
    return swReg;
  } catch (e) {
    add(el("div", "row err", "service worker refused: " + e));
    return null;
  }
}

function pushReason() {
  if (!secure) return "no notifications: this page is not on https — put `tailscale serve` " +
                     "(or any TLS proxy) in front of it, then reopen this URL.";
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    return "no notifications: this browser has no Web Push.";
  }
  // ORDER IS LOAD-BEARING (§5.5). iOS grants push ONLY to a PWA already on the Home Screen; a
  // bare tab that asks first burns the one prompt the owner ever sees and produces a
  // subscription that can never deliver. So the request is not merely discouraged before
  // install — it is unreachable, because this returns before `requestPermission` is called.
  if (!installed()) return "add to Home Screen first (Share → Add to Home Screen), then " +
                           "reopen from the icon to turn notifications on.";
  if (Notification.permission === "denied") {
    return "notifications are blocked for this app in system settings.";
  }
  return null;
}

async function enablePush() {
  const blocked = pushReason();
  if (blocked) { add(el("div", "row sys", blocked)); return; }
  const reg = swReg || await registerWorker();
  if (!reg) return;
  const granted = await Notification.requestPermission();
  if (granted !== "granted") { add(el("div", "row sys", "notifications not granted.")); return; }
  const { application_server_key } = await get("/api/push/key");
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,   // iOS permits nothing else; every push below shows something
    applicationServerKey: application_server_key,
  });
  const r = await post("/api/push/subscribe", sub.toJSON());
  add(el("div", "row sys", r.status === "subscribed"
    ? "notifications on for this device (" + r.devices + " enrolled)."
    : "the server refused the subscription: " + JSON.stringify(r)));
  paintPush();
}

function paintPush() {
  const b = $("pushBtn");
  b.hidden = false;
  const blocked = pushReason();
  b.textContent = blocked ? "notifications: unavailable"
    : (Notification.permission === "granted" ? "notifications: on" : "turn on notifications");
  b.title = blocked || "buzz this phone when a turn finishes or the gate needs you";
}

// A push carries where to land; opening from one, or tapping one while the app is open, has to
// actually go there (WEBCH-44).
async function followDeepLink(params) {
  const pending = params.get("pending");
  const ask = params.get("ask");
  if (ask && S.asks.has(ask)) { showAsk(S.asks.get(ask)); return; }
  if (pending || ask) await showQueue();
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", async (ev) => {
    const d = ev.data || {};
    if (d.type === "notificationclick" && d.url) {
      followDeepLink(new URLSearchParams(d.url.split("?")[1] || ""));
    } else if (d.type === "push") {
      // A push arrived while the app is open. Re-sync the badge from the server rather than
      // navigating: the stream is closed while backgrounded, so this page's counts may be
      // stale — but yanking the view out from under a thumb that is mid-sentence would be a
      // worse bug than a stale badge. The notification is still there to tap.
      try {
        const state = await get("/api/permissions");
        // Number keys, matching `S.parked.set(data.pending.id, ...)` on the event path —
        // a string key here would shadow rather than replace, and `PermissionResolved`
        // (which deletes by the event's numeric id) would then never clear the row.
        S.parked = new Map((state.parked || []).map(p => [p.id, p]));
        S.asks = new Map((state.blocking || []).map(a => [a.request_id, a]));
        paint();
      } catch (e) { /* offline: the badge stays as it was */ }
    }
  });
}

$("pushBtn").onclick = enablePush;
$("recheck").onclick = async () => {
  // "unreachable" must not be a dead end: the probe only re-runs when something asks it to.
  $("state").textContent = "re-checking…";
  try { const h = await get("/api/health"); paint(h.model_state); }
  catch (e) { S.offline = true; paint(); }
};

// ---------------------------------------------------------------- boot
(async () => {
  if (!token) {
    const t = prompt("app token (printed by `localharness web`, or scan its QR)");
    if (t) { token = t.trim(); LS.setItem("lh.token", token); }
  }
  try { await post("/api/auth/enroll", {}); } catch (e) { /* the bearer header still works */ }
  try {
    const [proto, tools, health] = await Promise.all([
      get("/api/protocol"), get("/api/tools"), get("/api/health"),
    ]);
    S.collapsible = proto.collapsible_groups || S.collapsible;
    S.modes = proto.modes || [];        // the settings pill's mode buttons, from the gate's own list
    for (const t of tools.tools) S.tools[t.name] = t;
    S.session = health.session_id || S.session;
    if (health.mode) S.mode = health.mode;
    if (health.agent_id) $("agentline").textContent = "agent · " + health.agent_id;
    paint(health.model_state);
    // WEBCH-29. The bring-up warning is one line on the wire, so a phone that connected after
    // it was sent would never know. This is the same fact, read as state on arrival.
    for (const other of (health.other_sessions || [])) {
      add(el("div", "row err", "another session is live on this agent: " + other.channel +
                               " (pid " + other.pid + ") in " + other.workspace +
                               ". Both keep working, but they share this agent's history."));
    }
    // THE PERSISTENT LAST EXCHANGE (owner, 2026-09-14, "typed a question got nothing"): an
    // answer that lands while no phone is watching must be ON the screen at the next open —
    // not filed behind the menu. A cold open therefore renders the live session's last
    // question and its answer off the persisted log (rule 1: the answer drawn is
    // TaskComplete's summary and nothing else); the greeting stays only for a session with
    // no exchanges yet. The live tail then continues below, so an in-flight turn's completion
    // still arrives as the next row.
    if (S.session && !log.children.length) {
      try {
        const res = await fetch(`/api/sessions/${encodeURIComponent(S.session)}/events`,
                                { headers: { "Authorization": "Bearer " + token } });
        let lastUser = null, lastAnswer = null;
        for (const line of (await res.text()).split("\n")) {
          let d; try { d = JSON.parse(line); } catch (e) { continue; }
          if (d.parent_id) continue;
          if (d.event_type === "UserMessage") { lastUser = d; lastAnswer = null; }
          else if (d.event_type === "TaskComplete") lastAnswer = d;
        }
        if (lastUser) {
          const r = add(el("div", "row user"));
          r.appendChild(el("div", null, lastUser.content));
          r.appendChild(el("div", "meta", "you · earlier"));
          if (lastAnswer) { const a = add(el("div", "row answer")); withCode(a, lastAnswer.summary || ""); }
        }
      } catch (e) { /* the clean open stays clean */ }
    }
    if (health.turn_in_progress)
      add(el("div", "row sys", "a turn is running — its answer lands right here when it finishes."));
  } catch (e) {
    add(el("div", "row err", "could not reach the API — is the token right? " + e));
  }
  // Plain HTTP on a LAN address is not merely "no install and no push" — the stream does not
  // work AT ALL, and it fails in the most misleading way available. `/api/auth/enroll` sets a
  // `Secure` cookie, browsers REJECT a Secure cookie on a non-secure origin, and EventSource
  // cannot send the bearer header instead — so every connect 401s and the page sits on
  // "offline — retrying" as though the wifi were bad. Say the cause, once, loudly.
  // (localhost is exempt: browsers treat it as a secure context and keep the cookie.)
  if (!secure) {
    add(el("div", "row err",
      "NOT ON HTTPS. The event stream cannot authenticate here: the browser refuses to keep " +
      "the session cookie on a plain-http origin, and EventSource cannot send a header " +
      "instead — so this page will retry forever and never connect. There is no home-screen " +
      "install and no notifications either. Put TLS in front of the port (tailscale serve " +
      "--bg, or any proxy) and open the https URL."));
  }

  // the screenshot's greeting, shown only while the transcript is empty — the first row that
  // arrives (backfill included) retires it via add()
  const hr = new Date().getHours();
  $("hello").textContent = hr < 5 ? "Up late" : hr < 12 ? "Good morning"
    : hr < 18 ? "Good afternoon" : "Good evening";
  if (!log.children.length) $("greet").hidden = false;

  connect();
  await registerWorker();
  paintPush();
  // Arrived from a notification: `/?session=…&pending=…`. Done after the first paint so the
  // parked queue it opens is populated.
  await followDeepLink(new URLSearchParams(location.search));

  // Coming back from the background is the commonest arrival, so re-check rather than trust the
  // stream to still be alive: iOS can leave an EventSource that believes it is connected.
  //
  // Going AWAY closes it on purpose, and that is what makes push honest: `client_count` on the
  // server is the presence signal that suppresses the turn-finished push (WEBCH-16), so an
  // abandoned stream left open would mean "somebody is watching" while the phone is in a
  // pocket. Closing it here makes the signal mean what it says.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (es) { es.close(); es = null; } return; }
    if (S.offline || !es || es.readyState === 2) connect();
    paintPush();
  });
})();
</script>
</body>
</html>
