<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- localharness app mark: the capped agent.
       Coordinates are the appicon-512.png geometry verbatim (k=1.36 character
       scale, brim length 52, bbox-centred so the whole mark including its
       outline clears every edge, every edge snapped to a whole 512-unit pixel).
       Ink bbox is 53,72 -> 458,440: margins 53px left/right (10.35%) and
       72/71px top/bottom (14%), so no mask can reach it. Plain shapes only.
       The cap mark uses the two-block degradation form, not letter paths: a
       favicon renders at 16-32px, well under the 9px letter-height floor where
       "LH" turns to mud. Green block = the L, white block = the H. -->

  <!-- full-bleed ground; no rounding, the browser/OS masks it -->
  <rect width="512" height="512" fill="#0D0F15"/>

  <!-- the agent's head: outline first, then fill. Both share one corner radius
       (0.246 x head width), so the stroke reads slightly tighter at the corners
       exactly as the raster does. -->
  <rect x="129" y="115" width="325" height="325" rx="71.9" fill="#074A24"/>
  <rect x="145" y="132" width="293" height="292" rx="71.9" fill="#56DC85"/>

  <!-- cap outline: crown (top corners only) + brim -->
  <path d="M180.1,72 H401.9 A57.1,57.1 0 0 1 459,129.1 V200 H123 V129.1 A57.1,57.1 0 0 1 180.1,72 Z" fill="#181B20"/>
  <rect x="53" y="142" width="282" height="79" rx="11.4" fill="#181B20"/>

  <!-- cap: crown flat-topped with rounded corners (a 5-panel), then the brim -->
  <path d="M180.8,88 H402.2 A40.8,40.8 0 0 1 443,128.8 V183 H140 V128.8 A40.8,40.8 0 0 1 180.8,88 Z" fill="#494D55"/>
  <rect x="69" y="159" width="250" height="46" rx="11.4" fill="#494D55"/>

  <!-- the brand4 mark on the front panel, in block form -->
  <rect x="266" y="113" width="21" height="36" fill="#56DC85"/>
  <rect x="296" y="113" width="21" height="36" fill="#FFFFFF"/>

  <!-- eyes -->
  <circle cx="223.4" cy="303.6" r="28.6" fill="#0D0F15"/>
  <circle cx="359.4" cy="303.6" r="28.6" fill="#0D0F15"/>
</svg>
